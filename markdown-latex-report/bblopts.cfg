% bblopts.cfg: British English hyphenation for documents with lang: en-GB.
%
% The pandoc template loads babel and calls \babelprovide[main,import]{british}. The locale
% file babel-en-GB.ini asks for the hyphenation rules "ukenglish", which TeX Live provides only
% with the package hyphen-english; without it babel sets the rules to \l@nil and TeX hyphenates
% nothing. babel reads this file while it loads, before the template's \babelprovide. Under
% LuaTeX the file allocates the language ukenglish and lists it with its pattern file
% hyph-en-gb.tex (beside this file); babel's LuaTeX loader then reads the patterns when the
% language is first selected. An installation that has ukenglish keeps its own patterns.
\ifx\directlua\@undefined\else\ifx\l@ukenglish\@undefined
  \newlanguage\l@ukenglish
  \xdef\bbl@languages{\bbl@languages\noexpand\bbl@elt{ukenglish}{\the\l@ukenglish}{hyph-en-gb.tex}{}}
\fi\fi
