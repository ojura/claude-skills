# Generated consumer copies are managed by install.py --ci.
name: Derivation toolkit

on:
  workflow_call:
    inputs:
      project:
        description: Project directory containing presentations.json and the installed toolkit.
        type: string
        default: .
      artifact_name:
        description: Name for this project's downloadable artifacts.
        type: string
        default: derivations
      html_deck:
        description: Catalog deck to export to standalone HTML; empty disables that job.
        type: string
        default: ""
      source_checks:
        description: Additional project checks inside the authoring container.
        type: string
        default: ""
      artifact_checks:
        description: Additional project checks after all PDF editions are built.
        type: string
        default: ""
      build_command:
        description: Compile project outputs into /assets; external input maps must use /assets paths.
        type: string
        default: python3 -B /src/tools/derivations.py build all --theme both --mode all --output-dir /assets
      package_inputs:
        description: Optional input-map filename under /assets for externally compiled documents.
        type: string
        default: ""

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  PROJECT: ${{ inputs.project }}
  ARTIFACT_NAME: ${{ inputs.artifact_name }}
  HTML_DECK: ${{ inputs.html_deck }}
  PACKAGE_INPUTS: ${{ inputs.package_inputs }}

jobs:
  assets:
    name: Verify authored sources and build document editions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the installed toolkit inventory
        run: python3 -B "$PROJECT/tools/derivations.py" list --json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Restore or build the locked authoring image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.project }}/tools/vendor/manim_pdfpc/derivation_toolkit
          file: ${{ inputs.project }}/tools/vendor/manim_pdfpc/derivation_toolkit/ci/assets.Dockerfile
          platforms: linux/amd64
          load: true
          tags: derivation-assets:ci
          cache-from: type=gha,version=2,scope=derivation-assets
          cache-to: type=gha,version=2,scope=derivation-assets,mode=max,timeout=3m,ignore-error=true
      - name: Test the toolkit, check source exports and build the project
        env:
          SOURCE_CHECKS: ${{ inputs.source_checks }}
          ARTIFACT_CHECKS: ${{ inputs.artifact_checks }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          mkdir -p "$RUNNER_TEMP/derivation-cache" "$RUNNER_TEMP/derivation-assets" "$RUNNER_TEMP/derivation-checks"
          docker run --rm --network none --platform linux/amd64 \
            --workdir /src --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/$PROJECT,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-cache,dst=/cache" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-assets,dst=/assets" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-checks,dst=/checks" \
            --env DERIVATION_CACHE_ROOT=/cache --env DERIVATION_TEST_BUILD=/cache/tests \
            --env PYTHONPATH=/src/tools/vendor/manim_pdfpc \
            --env XDG_CACHE_HOME=/cache/xdg --env TEXMFVAR=/cache/texmf-var \
            --env SOURCE_CHECKS --env ARTIFACT_CHECKS --env BUILD_COMMAND --env PACKAGE_INPUTS \
            derivation-assets:ci bash -euc '
              export PATH="/opt/manim/bin:$PATH"
              python3 -B -m unittest discover -s tools/vendor/manim_pdfpc/derivation_toolkit/tests \
                -t tools/vendor/manim_pdfpc -v
              if [[ -n $SOURCE_CHECKS ]]; then bash -euc "$SOURCE_CHECKS"; fi
              python3 -B -m derivation_toolkit.ci.authoring source \
                --project /src --output-dir /checks/export-consistency
              bash -euc "$BUILD_COMMAND"
              if [[ -n $ARTIFACT_CHECKS ]]; then bash -euc "$ARTIFACT_CHECKS"; fi
              input_args=()
              if [[ -n $PACKAGE_INPUTS ]]; then input_args=(--inputs "/assets/$PACKAGE_INPUTS"); fi
              python3 -B -m derivation_toolkit.ci.authoring artifacts --project /src \
                --assets /assets --output-dir /checks "${input_args[@]}"
            '
      - name: Upload source and document diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-checks
          path: ${{ runner.temp }}/derivation-checks/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-documents
          path: ${{ runner.temp }}/derivation-assets/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}-runtime-fixtures
          path: ${{ runner.temp }}/derivation-checks/runtime-fixtures.json
          if-no-files-found: error
          retention-days: 7

  html:
    name: Package and exercise the standalone browser document
    needs: assets
    if: inputs.html_deck != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}-documents
          path: ${{ runner.temp }}/derivation-assets
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install locked reader and PDF.js dependencies
        run: |
          toolkit="$PROJECT/tools/vendor/manim_pdfpc/derivation_toolkit"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r "$toolkit/animation/requirements-test.lock" -r "$toolkit/verify/requirements-browser.lock"
          mkdir -p "$PROJECT/build/tools/html5"
          cp "$toolkit/web/package.json" "$toolkit/web/package-lock.json" "$PROJECT/build/tools/html5/"
          npm ci --omit=optional --ignore-scripts --no-audit --no-fund --prefix "$PROJECT/build/tools/html5"
      - name: Build and exercise the exact standalone HTML
        run: |
          toolkit="$GITHUB_WORKSPACE/$PROJECT/tools/vendor/manim_pdfpc/derivation_toolkit"
          export PYTHONPATH="$toolkit/.."
          mkdir -p "$RUNNER_TEMP/derivation-html"
          input_args=()
          if [[ -n $PACKAGE_INPUTS ]]; then input_args=(--inputs "$RUNNER_TEMP/derivation-assets/$PACKAGE_INPUTS"); fi
          python -B -m derivation_toolkit.ci.authoring html \
            --project "$GITHUB_WORKSPACE/$PROJECT" --deck "$HTML_DECK" \
            --assets "$RUNNER_TEMP/derivation-assets" \
            --output-dir "$RUNNER_TEMP/derivation-html/$HTML_DECK-html5" "${input_args[@]}"
          node --test "$toolkit/web/test/"*.test.mjs
          python -B -m derivation_toolkit.verify.browser \
            --html "$RUNNER_TEMP/derivation-html/$HTML_DECK-html5/index.html" \
            --output-dir "$RUNNER_TEMP/derivation-html/review" --browser chrome --protocol both
          test -s "$RUNNER_TEMP/derivation-html/$HTML_DECK-html5.zip"
      - name: Upload the standalone browser presentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: false
          path: ${{ runner.temp }}/derivation-html/*-html5.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact_name }}-browser-checks
          path: ${{ runner.temp }}/derivation-html/review/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Bundle the native viewer on Ubuntu 20.04
    needs: assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact_name }}-documents
          path: ${{ runner.temp }}/derivation-assets
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ inputs.project }}/tools/vendor/manim_pdfpc/derivation_toolkit
          file: ${{ inputs.project }}/tools/vendor/manim_pdfpc/derivation_toolkit/ci/focal-builder.Dockerfile
          platforms: linux/amd64
          load: true
          tags: derivation-focal:ci
          cache-from: type=gha,version=2,scope=derivation-focal
          cache-to: type=gha,version=2,scope=derivation-focal,mode=max,timeout=3m,ignore-error=true
      - name: Test the native payload reader and package against glibc 2.31
        run: |
          mkdir -p "$RUNNER_TEMP/derivation-package"
          docker run --rm --platform linux/amd64 --workdir /src \
            --mount "type=bind,src=$GITHUB_WORKSPACE/$PROJECT,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-assets,dst=/assets,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-package,dst=/work" \
            --env PYTHONPATH=/src/tools/vendor/manim_pdfpc --env DERIVATION_TEST_BUILD=/work/tests \
            --env "SOURCE_REVISION=$GITHUB_SHA" --env ARTIFACT_NAME --env PACKAGE_INPUTS \
            derivation-focal:ci bash -euc '
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.31"
              pkg-config --exists glib-2.0 json-glib-1.0 zlib
              python3 -B -m unittest derivation_toolkit.tests.test_payload_bundle -v
              input_args=()
              if [[ -n $PACKAGE_INPUTS ]]; then input_args=(--inputs "/assets/$PACKAGE_INPUTS"); fi
              python3 -B /src/tools/derivations.py package all --assets /assets \
                --work-dir /work/build --output "/work/$ARTIFACT_NAME.appimage" \
                --source-revision "$SOURCE_REVISION" "${input_args[@]}"
              python3 -B -m derivation_toolkit.ci.authoring package-inputs \
                --project /src --assets /assets --output-dir /work/inputs "${input_args[@]}"
              python3 -B /src/tools/derivations.py package-template \
                --appdir /work/build/AppDir --tools /work/build/tools --destination /work/template
              python3 -B /src/tools/derivations.py package-prepare all \
                --template /work/template/template.appimage --template-info /work/template/template.json \
                --destination /work/transport --source-revision "$SOURCE_REVISION"
              python3 -B /src/tools/derivations.py package-assemble \
                --transport /work/transport --inputs /work/inputs/compiled-inputs.json \
                --work-dir /work/assembly-work --output-dir /work/assembled
              cp /work/assembled/output.appimage "/work/${ARTIFACT_NAME}-data-only.appimage"
              chmod 0755 "/work/${ARTIFACT_NAME}-data-only.appimage"
            ' 2>&1 | tee "$RUNNER_TEMP/derivation-package/build.log"
          test -s "$RUNNER_TEMP/derivation-package/$ARTIFACT_NAME.appimage"
          test -s "$RUNNER_TEMP/derivation-package/$ARTIFACT_NAME-data-only.appimage"
      - name: Upload the runnable file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: false
          path: ${{ runner.temp }}/derivation-package/${{ inputs.artifact_name }}.appimage
          if-no-files-found: error
          retention-days: 30
      - name: Upload the data-only assembled runnable file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          archive: false
          path: ${{ runner.temp }}/derivation-package/${{ inputs.artifact_name }}-data-only.appimage
          if-no-files-found: error
          retention-days: 30
      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact_name }}-package-checks
          path: |
            ${{ runner.temp }}/derivation-package/build.log
            ${{ runner.temp }}/derivation-package/*.build-info.txt
            ${{ runner.temp }}/derivation-package/*.sha256
            ${{ runner.temp }}/derivation-package/template/template.json
            ${{ runner.temp }}/derivation-package/assembled/*.json
          if-no-files-found: warn
          retention-days: 14

  runtime:
    name: Run ${{ matrix.kind }} on Ubuntu ${{ matrix.ubuntu }}
    needs: [assets, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: "20.04"
            kind: ordinary
            suffix: ""
            image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - ubuntu: "24.04"
            kind: ordinary
            suffix: ""
            image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
          - ubuntu: "20.04"
            kind: data-only
            suffix: -data-only
            image: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - ubuntu: "24.04"
            kind: data-only
            suffix: -data-only
            image: ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact_name }}${{ matrix.suffix }}.appimage
          path: ${{ runner.temp }}/derivation-runtime
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact_name }}-runtime-fixtures
          path: ${{ runner.temp }}/derivation-fixtures
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.2
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ inputs.project }}/tools/vendor/manim_pdfpc/derivation_toolkit
          file: ${{ inputs.project }}/tools/vendor/manim_pdfpc/derivation_toolkit/ci/runtime.Dockerfile
          build-args: BASE_IMAGE=${{ matrix.image }}
          platforms: linux/amd64
          load: true
          tags: derivation-runtime:ci
          cache-from: type=gha,version=2,scope=derivation-runtime-${{ matrix.ubuntu }}
          cache-to: type=gha,version=2,scope=derivation-runtime-${{ matrix.ubuntu }},mode=max,timeout=3m,ignore-error=true
      - name: Exercise the exact relocated package with networking disabled
        env:
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          chmod +x "$RUNNER_TEMP/derivation-runtime/$ARTIFACT_NAME$PACKAGE_SUFFIX.appimage"
          mkdir -p "$RUNNER_TEMP/derivation-runtime-checks"
          docker run --rm --network none --platform linux/amd64 \
            --user "$(id -u):$(id -g)" --workdir /evidence \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-runtime/$ARTIFACT_NAME$PACKAGE_SUFFIX.appimage,dst=/bundle/presentation.appimage,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-fixtures/runtime-fixtures.json,dst=/input/fixtures.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/derivation-runtime-checks,dst=/evidence" \
            derivation-runtime:ci run --appimage /bundle/presentation.appimage \
              --fixtures /input/fixtures.json --output /evidence --expected-ubuntu '${{ matrix.ubuntu }}'
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact_name }}-runtime-${{ matrix.kind }}-${{ matrix.ubuntu }}
          path: ${{ runner.temp }}/derivation-runtime-checks/
          if-no-files-found: warn
          retention-days: 14
